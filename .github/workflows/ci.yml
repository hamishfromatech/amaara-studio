name: CI

on:
  push:
    branches: [main]
  pull_request: {}
  release:
    types: [published]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-env: true
          key: ${{{{ steps.cache.outputs.key }}}}
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --workspace

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: cd ui && pnpm install --frozen
      - run: cd ui && pnpm typecheck
      - run: cd ui && pnpm lint
      - run: cd ui && pnpm build

  # Full desktop build smoke (Windows-first; macOS/Linux added in Phase 14).
  bundle-smoke:
    needs: [rust, ui]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo build --release

  # Release workflow (Gate 14)
  release:
    needs: [rust, ui, bundle-smoke]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4
      - name: cargo tauri build
        run: cargo tauri build --target x86_64-unknown-linux-gnu
