[package]
name = "navya-tools"
version = "0.1.0"
edition = "2021"
description = "Navya Studio shared tool-backend lib (logic, no I/O deps)."

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
